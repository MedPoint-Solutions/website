name: Update LinkedIn posts

on:
  schedule:
    - cron: "17 11 * * *"   # daily, about 7 AM Eastern
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new posts and rebuild the portfolio page
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LINKEDIN_PROFILE_URL: ${{ vars.LINKEDIN_PROFILE_URL }}
        run: python scripts/update_posts.py

      - name: Commit if anything changed
        run: |
          git config user.name "medpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json portfolio.html
          git diff --cached --quiet || git commit -m "Update LinkedIn posts"
          git push
